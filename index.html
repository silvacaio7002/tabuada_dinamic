<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada Dinâmica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="cab">
            <h1 class="typing-effect">Tabuada Dinâmica</h1>
            <p>Venha conhecer o poder da matemática</p>
            <p>Digite seu nome para poder participar, em seguida, insira um número para que possamos ver a tabuada do mesmo.</p>
        </div>
        <div class="bd">
            <form action="pross.php" method="post">
                <label for="name">Nome</label>
                <input type="text" name="name" id="name" required>
                <label for="num">Número</label>
                <input type="number" name="num" id="num" required>
                <button type="submit">🧮<strong>Calcular</strong></button>
            </form>
        </div>
    
    </main>
    <div class="math-background">
        <span class="symbol">π</span>
        <span class="symbol">√</span>
        <span class="symbol">∑</span>
        <span class="symbol">∞</span>
        <span class="symbol">∫</span>
        <span class="symbol">Δ</span>
    </div>
</body>
</html>
